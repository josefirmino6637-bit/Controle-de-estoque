<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Drive Store - Controle de Estoque</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans antialiased">
    
    <div class="max-w-4xl mx-auto px-4 py-8">
        <!-- Cabeçalho -->
        <header class="flex flex-col md:flex-row justify-between items-center mb-8 border-b border-slate-800 pb-6">
            <div>
                <h1 class="text-3xl font-black tracking-tight text-blue-400">Smart Drive Store</h1>
                <p class="text-sm text-slate-400 mt-1">Controle de Estoque e Gestão de Ativos</p>
            </div>
            <div class="mt-4 md:mt-0 bg-slate-800 px-4 py-2 rounded-xl border border-slate-700 text-xs text-slate-300">
                Status: <span class="text-emerald-400 font-semibold">Online & Sincronizado</span>
            </div>
        </header>

        <!-- Cards de Resumo -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">
            <div class="bg-slate-800/50 border border-slate-700/60 p-6 rounded-2xl shadow-sm">
                <p class="text-xs font-semibold tracking-wider text-slate-400 uppercase">Total de Itens</p>
                <p id="totalItens" class="text-4xl font-extrabold text-white mt-2">0</p>
            </div>
            <div class="bg-slate-800/50 border border-slate-700/60 p-6 rounded-2xl shadow-sm">
                <p class="text-xs font-semibold tracking-wider text-slate-400 uppercase">Valor Total em Estoque</p>
                <p id="valorTotal" class="text-4xl font-extrabold text-emerald-400 mt-2">R$ 0,00</p>
            </div>
        </div>

        <!-- Formulário de Cadastro -->
        <div class="bg-slate-800 border border-slate-700 p-6 rounded-2xl shadow-lg mb-8">
            <h2 class="text-lg font-bold text-white mb-4">Adicionar Novo Item</h2>
            <form id="produtoForm" class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <div class="md:col-span-2">
                    <label class="block text-xs font-medium text-slate-400 mb-1">Nome do Produto</label>
                    <input type="text" id="nome" required placeholder="Ex: Suporte Veicular Magnético" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-white text-sm focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Quantidade</label>
                    <input type="number" id="quantidade" min="1" value="1" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-white text-sm focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Preço Unitário (R$)</label>
                    <input type="number" id="preco" step="0.01" min="0" placeholder="0,00" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-white text-sm focus:outline-none focus:border-blue-500">
                </div>
                <div class="md:col-span-4 mt-2">
                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3 px-4 rounded-xl transition duration-200 shadow-md">
                        Cadastrar no Estoque
                    </button>
                </div>
            </form>
        </div>

        <!-- Seção de Listagem e Filtros -->
        <div class="bg-slate-800 border border-slate-700 p-6 rounded-2xl shadow-lg">
            <div class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
                <h2 class="text-lg font-bold text-white">Itens em Estoque</h2>
                <input type="text" id="busca" placeholder="Pesquisar produto..." class="w-full md:w-64 bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-slate-700 text-xs text-slate-400 uppercase">
                            <th class="py-3 px-4">Produto</th>
                            <th class="py-3 px-4">Qtd</th>
                            <th class="py-3 px-4">Preço Unit.</th>
                            <th class="py-3 px-4">Total</th>
                            <th class="py-3 px-4 text-right">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabelaProdutos" class="divide-y divide-slate-700/50 text-sm">
                        <!-- Os produtos entram aqui dinamicamente -->
                    </tbody>
                </table>
                <div id="vazio" class="text-center py-8 text-slate-500 text-sm">
                    Nenhum produto cadastrado no momento.
                </div>
            </div>
        </div>
    </div>

    <script>
        let produtos = JSON.parse(localStorage.getItem('smart_drive_estoque')) || [];

        const form = document.getElementById('produtoForm');
        const tabela = document.getElementById('tabelaProdutos');
        const totalItensEl = document.getElementById('totalItens');
        const valorTotalEl = document.getElementById('valorTotal');
        const vazioEl = document.getElementById('vazio');
        const buscaInput = document.getElementById('busca');

        function salvarEAtualizar() {
            localStorage.setItem('smart_drive_estoque', JSON.stringify(produtos));
            renderizar();
        }

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const nome = document.getElementById('nome').value;
            const quantidade = parseInt(document.getElementById('quantidade').value);
            const preco = parseFloat(document.getElementById('preco').value);

            produtos.push({ id: Date.now(), nome, quantidade, preco });
            form.reset();
            document.getElementById('quantidade').value = 1;
            salvarEAtualizar();
        });

        function deletar(id) {
            produtos = produtos.filter(p => p.id !== id);
            salvarEAtualizar();
        }

        function renderizar() {
            tabela.innerHTML = '';
            const termoBusca = buscaInput.value.toLowerCase();
            const filtrados = produtos.filter(p => p.nome.toLowerCase().includes(termoBusca));

            if (filtrados.length === 0) {
                vazioEl.classList.remove('hidden');
            } else {
                vazioEl.classList.add('hidden');
            }

            let totalQtd = 0;
            let totalVal = 0;

            filtrados.forEach(p => {
                totalQtd += p.quantidade;
                totalVal += (p.quantidade * p.preco);

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="py-3.5 px-4 font-medium text-white">${p.nome}</td>
                    <td class="py-3.5 px-4 text-slate-300">${p.quantidade}</td>
                    <td class="py-3.5 px-4 text-slate-300">R$ ${p.preco.toFixed(2).replace('.', ',')}</td>
                    <td class="py-3.5 px-4 text-slate-300 font-semibold">R$ ${(p.quantidade * p.preco).toFixed(2).replace('.', ',')}</td>
                    <td class="py-3.5 px-4 text-right">
                        <button onclick="deletar(${p.id})" class="text-rose-400 hover:text-rose-300 text-xs font-medium bg-rose-500/10 hover:bg-rose-500/20 px-3 py-1.5 rounded-lg transition">Excluir</button>
                    </td>
                `;
                tabela.appendChild(tr);
            });

            totalItensEl.textContent = totalQtd;
            valorTotalEl.textContent = `R$ ${totalVal.toFixed(2).replace('.', ',')}`;
        }

        buscaInput.addEventListener('input', renderizar);
        renderizar();
    </script>
</body>
</html>
