<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Balcão - Loja</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 600px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .hidden { display: none; }
        input, button { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background: #007bff; color: white; border: none; font-weight: bold; cursor: pointer; }
        button:hover { background: #0056b3; }
        .produto-item { background: #f9f9f9; padding: 10px; margin-bottom: 10px; border-left: 4px solid #007bff; display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>

    <div class="container">
        <!-- TELA DE LOGIN -->
        <div id="login-section">
            <h2>🔐 Login do Operador</h2>
            <input type="email" id="login-email" placeholder="E-mail do operador">
            <input type="password" id="login-senha" placeholder="Senha">
            <button id="btn-login">Entrar no Sistema</button>
        </div>

        <!-- TELA PRINCIPAL DO SISTEMA -->
        <div id="app-section" class="hidden">
            <h2>🛒 Frente de Caixa & Estoque</h2>
            <button id="btn-logout" style="background: #dc3545; margin-bottom: 20px;">Sair / Fechar Turno</button>
            
            <hr>
            
            <h3>Cadastrar Novo Produto</h3>
            <input type="text" id="prod-nome" placeholder="Nome do Produto (ex: Disjuntor 32A)">
            <input type="text" id="prod-cat" placeholder="Categoria (ex: Elétrica)">
            <input type="number" id="prod-custo" placeholder="Preço de Custo (R$)">
            <input type="number" id="prod-venda" placeholder="Preço de Venda (R$)">
            <input type="number" id="prod-qtd" placeholder="Quantidade Inicial no Estoque">
            <button id="btn-cadastrar">Salvar Produto</button>

            <hr>

            <h3>Produtos no Estoque</h3>
            <div id="lista-produtos">Carregando produtos...</div>
        </div>
    </div>

    <!-- SCRIPT DO FIREBASE E LÓGICA -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

        // COLE AQUI AS SUAS CHAVES REAIS DO FIREBASE QUE VOCÊ COPIOU
        const firebaseConfig = {
            apiKey: "COLE_ SUA_API_KEY_AQUI",
            authDomain: "COLE_SEU_AUTH_DOMAIN_AQUI",
            projectId: "COLE_SEU_PROJECT_ID_AQUI",
            storageBucket: "COLE_SEU_STORAGE_BUCKET_AQUI",
            messagingSenderId: "COLE_SEU_MESSAGING_SENDER_ID_AQUI",
            appId: "COLE_SEU_APP_ID_AQUI"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Elementos da Tela
        const loginSection = document.getElementById('login-section');
        const appSection = document.getElementById('app-section');
        
        // Controle de Sessão
        onAuthStateChanged(auth, (user) => {
            if (user) {
                loginSection.classList.add('hidden');
                appSection.classList.remove('hidden');
                carregarProdutos();
            } else {
                loginSection.classList.remove('hidden');
                appSection.classList.add('hidden');
            }
        });

        // Ação de Login
        document.getElementById('btn-login').addEventListener('click', async () => {
            const email = document.getElementById('login-email').value;
            const senha = document.getElementById('login-senha').value;
            try {
                await signInWithEmailAndPassword(auth, email, senha);
            } catch (error) {
                alert("Erro ao entrar: " + error.message);
            }
        });

        // Ação de Logout
        document.getElementById('btn-logout').addEventListener('click', async () => {
            await signOut(auth);
        });

        // Cadastrar Produto
        document.getElementById('btn-cadastrar').addEventListener('click', async () => {
            const nome = document.getElementById('prod-nome').value;
            const categoria = document.getElementById('prod-cat').value;
            const custo = document.getElementById('prod-custo').value;
            const venda = document.getElementById('prod-venda').value;
            const qtd = document.getElementById('prod-qtd').value;

            if (!nome || !venda || !qtd) {
                alert("Preencha ao menos o nome, preço de venda e quantidade!");
                return;
            }

            try {
                await addDoc(collection(db, "produtos"), {
                    nome, categoria,
                    precoCusto: Number(custo),
                    precoVenda: Number(venda),
                    quantidadeEstoque: Number(qtd),
                    atualizadoEm: new Date()
                });
                alert("Produto cadastrado com sucesso!");
                document.getElementById('prod-nome').value = '';
                document.getElementById('prod-cat').value = '';
                document.getElementById('prod-custo').value = '';
                document.getElementById('prod-venda').value = '';
                document.getElementById('prod-qtd').value = '';
                carregarProdutos();
            } catch (e) {
                alert("Erro ao cadastrar: " + e.message);
            }
        });

        // Listar e Vender Produtos
        async function carregarProdutos() {
            const listaDiv = document.getElementById('lista-produtos');
            listaDiv.innerHTML = "Carregando...";
            try {
                const querySnapshot = await getDocs(collection(db, "produtos"));
                listaDiv.innerHTML = "";
                querySnapshot.forEach((documento) => {
                    const p = documento.data();
                    const id = documento.id;
                    
                    const item = document.createElement('div');
                    item.className = 'produto-item';
                    item.innerHTML = `
                        <div>
                            <strong>${p.nome}</strong> (${p.categoria || 'Geral'})<br>
                            Preço: R$ ${p.precoVenda} | Estoque: <strong>${p.quantidadeEstoque}</strong>
                        </div>
                        <button style="width: auto; padding: 5px 10px;" onclick="vender('${id}')">Vender 1</button>
                    `;
                    listaDiv.appendChild(item);
                });
            } catch (e) {
                listaDiv.innerHTML = "Erro ao carregar o estoque.";
            }
        }

        // Função global para o botão de venda
        window.vender = async function(id) {
            try {
                const prodRef = doc(db, "produtos", id);
                await updateDoc(prodRef, {
                    quantidadeEstoque: increment(-1)
                });
                alert("Venda realizada! Estoque atualizado.");
                carregarProdutos();
            } catch (e) {
                alert("Erro ao realizar venda: " + e.message);
            }
        }
    </script>
</body>
</html>
